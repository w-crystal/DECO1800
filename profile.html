<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Harmony — Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <style>
    /* Profile-specific styles */
    body {
      overflow: hidden;
    }

    /* Override main-container for profile page */
    .main-container {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 0;
    }

    /* Profile Card */
    .profile-card {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
      background-color: rgba(70, 78, 123, 0.82);
      border: 3px solid white;
      border-radius: 20px;
      box-shadow: 5px 5px 3px white;
      padding: 40px 60px;
      max-width: 850px;
      width: 90%;
    }

    .avatar {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid white;
      flex-shrink: 0;
    }

    .profile-info {
      text-align: left;
      max-width: 520px;
    }

    .profile-name {
      font-size: 32px;
      font-weight: bold;
      margin: 0 0 10px;
      color: white;
    }

    .profile-subtitle {
      font-size: 16px;
      opacity: 0.9;
      margin: 0 0 20px;
      color: white;
    }

    .profile-bio {
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 20px;
      color: white;
    }

    .profile-skills {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .profile-tag {
      padding: 8px 16px;
      border-radius: 999px;
      border: 1.5px solid white;
      color: white;
      font-size: 14px;
      background-color: transparent;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .profile-card {
        flex-direction: column;
        text-align: center;
        padding: 30px 20px;
      }

      .profile-info {
        text-align: center;
      }

      .avatar {
        width: 150px;
        height: 150px;
      }

      .profile-name {
        font-size: 28px;
      }

      .profile-skills {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <div id="sidebar-placeholder"></div>

  <!-- Profile Content -->
  <main class="main-container">
    <section class="profile-card">
      <img src="images/johnsmith.jpg" alt="John Smith" class="avatar">
      <div class="profile-info">
        <h1 class="profile-name">John Smith</h1>
        <p class="profile-subtitle">Pianist &amp; Guitarist • Brisbane, Australia</p>
        <p class="profile-bio">
          Hi, I'm John Smith — a pianist and guitarist who loves creating Pop and EDM music
          to share my passion with everyone.
        </p>
        <div class="profile-skills">
          <span class="profile-tag">#Piano</span>
          <span class="profile-tag">#Guitar</span>
          <span class="profile-tag">#Pop</span>
          <span class="profile-tag">#EDM</span>
        </div>
      </div>
    </section>
  </main>

  <!-- Sidebar Script -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const sidebarPlaceholder = document.getElementById("sidebar-placeholder");
      
      fetch("sidebar.html")
        .then((response) => response.text())
        .then((data) => {
          sidebarPlaceholder.innerHTML = data;

          // Add sidebar hover effects
          sidebarPlaceholder.addEventListener('mouseenter', () => {
            document.body.classList.add('sidebar-expanded');
          });
          sidebarPlaceholder.addEventListener('mouseleave', () => {
            document.body.classList.remove('sidebar-expanded');
          });

          // Highlight current page in nav
          const currentPage = window.location.pathname.split("/").pop() || "profile.html";
          const navLinks = sidebarPlaceholder.querySelectorAll(".nav-item");
          navLinks.forEach((link) => {
            if (link.getAttribute("href") === currentPage) {
              link.classList.add("active");
            }
          });
        })
        .catch((error) => console.error("Error fetching the sidebar:", error));
    });
  </script>
</body>
</html>
